[project]
name = "lic-cli"
version = "1.1.2"
description = "Minimal license generator"
readme = "README.md"
authors = [
    { name = "kushvinth", email = "kushvinth.m@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "questionary>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/kushvinth/lic"
Repository = "https://github.com/kushvinth/lic"
Issues = "https://github.com/kushvinth/lic/issues"

[project.scripts]
lic = "lic_cli.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]